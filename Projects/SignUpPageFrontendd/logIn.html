<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="mx-[735px] mt-[60px]  flex flex-col justify-center gap-5">

        <div class="flex justify-start ">
            <img src="assets/twitter-logo-4 1.png" alt="logo" class="flex flex-row">
        </div>
        <div class="flex flex-row justify-start">
            <p class="flex font-bold text-[40px]">Log in To Twitter</p>
        </div>
        <section class="flex flex-col justify-center gap-5">
            <input type="text" placeholder="Phone number, email address" class="pt-5 w-[450px] h-[70px] border border-gray-300 rounded-[10px]  p-[10px] w-[480px] pb-[24px] ">
            <input type="password" placeholder="password" class="pt-5 w-[450px] h-[70px] border border-gray-300 rounded-[10px]  p-[10px] w-[480px] pb-[24px]">
            <button class="pt-5 w-[450px] h-[50px] border border-gray-300 rounded-[30px] bg-[#1DA1F2]  p-[10px] w-[480px] pb-[24px] flex items-center justify-center">Log In</button>

            <section class="flex flex-row justify-between w-[480px] h-[70px] text-blue-500">
                <a href="/forgot">Forgot Password</a>
                <a href="signUpPage.html">Sign up to Twitter</a>
            </section>
        </section>
    </div>
</body>
</html>
