<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">

        <!-- 
            td is for table data cell
            tr is for table row
            th is for table header to be bold
        -->
        <tr>
            <th>Sno</th> <!-- th used for bold in table -->
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Abc</td>
            <td>20</td>
            <td>male</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Xyz</td>
            <td>20</td>
            <td>Female</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Pqr</td>
            <td>20</td>
            <td>Female</td>
        </tr>
    </table>


    <br>
    <br>
    <table border="1">

        <!-- Semantic version of table tags -->
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
            </tr>    
        </thead>
        <tbody>
            <tr>
                <td>Mobile</td>
                <td>20000</td>
            </tr>
            <tr>
                <td>Mouse</td>
                <td>2000</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td>20000</td>
            </tr>
        </tfoot>


    </table>




    <br>
    <br>
    <table border="1">

        <!-- 
            td is for table data cell
            tr is for table row
            th is for table header to be bold
        -->
        <tr>
            <th>Sno</th> <!-- th used for bold in table -->
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
        </tr>
        <tr>
            <td colspan="2">1</td>
            <!-- <td>Abc</td> -->
            <td>20</td>
            <td>male</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Xyz</td>
            <td>20</td>
            <td rowspan="2">Female</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Pqr</td>
            <td>20</td>
            <!-- <td>Female</td> -->
        </tr>
    </table>
</body>
</html>
